[package]
name = "rustdom-x-compact-vm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[features]
# Negative control used only to measure the cost and semantic necessity of the
# software CFROUND path. Never enable for a RandomX verifier.
nearest-only-audit = []

[dependencies]
blake2b_simd = "1.0.4"
randomx-softfp = { path = "../softfp" }
rustdom-x = { path = "../rustdom-x", features = ["unchecked-superscalar"] }
