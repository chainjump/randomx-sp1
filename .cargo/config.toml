[build]
# Sibling repositories share compatible intermediates; final binaries stay in target/.
build-dir = "../.cargo-build"

[env]
# These also reach SP1's separately built native executor without sharing its lock.
CARGO_INCREMENTAL = "0"
CARGO_PROFILE_DEV_DEBUG = "0"
CARGO_PROFILE_TEST_DEBUG = "0"

[future-incompat-report]
frequency = "never"
