[package]
name = "randomx-sp1-network-prover"
version = "0.1.1"
edition = "2021"
rust-version = "1.94.1"
description = "Succinct Network proof and EVM simulation client for randomx-sp1"
license = "MIT OR Apache-2.0"
publish = false
readme = "README.md"

[dependencies]
alloy-primitives = "=1.7.1"
alloy-sol-types = "=1.6.1"
anyhow = "1.0"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
sha2 = "0.10"
sp1-sdk = { version = "=6.3.1", default-features = false, features = ["network"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
resolver = "2"

[profile.release]
lto = "thin"
