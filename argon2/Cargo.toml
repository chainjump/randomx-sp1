[package]
name = "randomx-sp1-argon2"
version = "2.1.0"
authors = ["Martijn Rijkeboer <mrr@sru-systems.com>"]
edition = "2021"
rust-version = "1.91"
description = "Internal Argon2 implementation specialized for randomx-sp1 cache construction"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "argon2"

[dependencies]
base64 = "=0.21.7"
blake2b_simd = "=1.0.4"
constant_time_eq = "=0.3.1"
serde = { version = "=1.0.229", optional = true, features = ["derive"] }

[dev-dependencies]
hex = "=0.4.3"
