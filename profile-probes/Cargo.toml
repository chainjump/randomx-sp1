[package]
name = "randomx-sp1-profile-probes"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "SP1 profiling probes for randomx-sp1 optimization work"
license = "GPL-3.0-only"
publish = false

[features]
default = ["cache-only"]
cache-only = []
no-memory-hash = []

[dependencies]
randomx-sp1-core = { path = "../randomx-core", features = ["unchecked-superscalar"] }
randomx-sp1 = { path = "../randomx-sp1", features = ["audit-internals"] }
sp1-zkvm = "=6.3.1"

[dev-dependencies]
blake2b_simd = "=1.0.4"
hex = "=0.4.3"
