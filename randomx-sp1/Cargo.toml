[package]
name = "randomx-sp1"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "SP1-optimized, runtime-key RandomX hashing"
readme = "README.md"
license = "GPL-3.0-only"
publish = false

[features]
audit-internals = []
differential-audit = ["audit-internals"]

[dependencies]
blake2b_simd = "=1.0.4"
randomx-softfp = { path = "../softfp" }
randomx-sp1-core = { path = "../randomx-core", features = ["unchecked-superscalar"] }
