[package]
name = "randomx-sp1-audit"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Correctness and differential audits for randomx-sp1"
license = "GPL-3.0-only"
publish = false
build = "build.rs"

[features]
official-randomx = []

[[bin]]
name = "official_randomx"
path = "src/bin/official_randomx.rs"
required-features = ["official-randomx"]

[[bin]]
name = "network_fixture_builder"
path = "src/bin/network_fixture_builder.rs"
required-features = ["official-randomx"]

[[bin]]
name = "monero_blocks"
path = "src/bin/monero_blocks.rs"

[dependencies]
blake2b_simd = "1.0.4"
randomx-softfp = { path = "../softfp" }
randomx-sp1-core = { path = "../randomx-core", features = ["unchecked-superscalar"] }
randomx-sp1 = { path = "../randomx-sp1", features = ["differential-audit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
