[package]
name = "randomx-sp1-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Correctness and differential audits for randomx-sp1"
license = "GPL-3.0-only"
publish.workspace = true
build = "build.rs"
autobins = false

[features]
official-randomx = []

[[bin]]
name = "official_randomx"
path = "src/bin/official_randomx.rs"
required-features = ["official-randomx"]
test = false

[[bin]]
name = "network_fixture_builder"
path = "src/bin/network_fixture_builder.rs"
required-features = ["official-randomx"]
test = false

[[bin]]
name = "monero_block_input"
path = "src/bin/monero_block_input.rs"
test = false

[dependencies]
blake2b_simd.workspace = true
randomx-softfp.workspace = true
randomx-sp1-core = { workspace = true, features = ["unchecked-superscalar"] }
randomx-sp1 = { workspace = true, features = ["differential-audit"] }
serde.workspace = true
serde_json.workspace = true
tiny-keccak.workspace = true
