[package]
name = "randomx-softfp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Exact RandomX binary64 arithmetic for SP1"
readme = "README.md"
license.workspace = true
publish.workspace = true

[features]
sp1-guest = ["dep:sp1-zkvm"]

[[bin]]
name = "randomx-softfp-guest"
path = "src/guest.rs"
required-features = ["sp1-guest"]

[dependencies]
sp1-zkvm = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "riscv64"))'.dependencies]
softfloat.workspace = true

[dev-dependencies]
softfloat-wrapper.workspace = true
